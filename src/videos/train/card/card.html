<!doctype html><html><body style="margin:0;background:transparent"><canvas id="c"></canvas>
<script type="module">
import { char, HERO } from '/toon/char.js';
import { setCtx, S } from '/toon/kit.js';
window.drawCard = (p) => {
  const PX = 300, CW = 640 + 2 * PX, CH = 1100, AK = p.ak || 3;
  const cv = document.getElementById('c'); cv.width = Math.round(CW * AK); cv.height = Math.round(CH * AK);
  const g = cv.getContext('2d'); setCtx(g); S.boil = 0; g.clearRect(0, 0, cv.width, cv.height);
  g.setTransform(AK, 0, 0, AK, 0, 0); g.translate(PX, 50);
  const lean = p.lean || 0; g.translate(320, 1000); g.rotate(lean); g.translate(-320, -1000);
  const look = { ...HERO, ...(p.look || {}) };
  char(320, 1000, 1.02, { look, mood: p.mood || 'focus', turn: p.turn ?? 0, lookAt: p.lookAt || [0, 0], armL: p.armL, armR: p.armR,
    legSwing: p.legSwing ?? 0.3, headDx: p.headDx || 0, noShadow: true, ik: true, armsFront: !!p.armsFront, gripL: !!p.gripL, gripR: !!p.gripR,
    bendL: p.bendL || [-0.3, 1], bendR: p.bendR || [0.3, 1] });
  return cv.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
