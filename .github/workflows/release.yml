name: Publish 4K video
# Joins the <95 MB parts in video/ (GitHub rejects bigger files in git) into one MP4 and attaches it to a GitHub
# Release, so the whole video downloads from one link. Runs only once video/manifest.txt lists every part.
on:
  push:
    branches: [release/4k]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Join the parts and check them
        id: join
        run: |
          [ -f video/manifest.txt ] || { echo "no manifest yet, nothing to publish"; exit 0; }
          name=$(head -1 video/manifest.txt)
          sha=$(sed -n 2p video/manifest.txt)
          cat video/part_* > "$name"
          echo "$sha  $name" | sha256sum -c -
          echo "file=$name" >> "$GITHUB_OUTPUT"
      - name: Attach to the release
        if: steps.join.outputs.file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="${{ steps.join.outputs.file }}"
          gh release view v1.0 >/dev/null 2>&1 || gh release create v1.0 --target "$GITHUB_SHA" --title "America Azaad Kaise Hua · 4K 60fps" --notes "Full video, 8:12, 3840x2160, 60 fps. Click the .mp4 below to download."
          gh release upload v1.0 "$f" --clobber
